<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#40c463"/>
      <stop offset="100%" style="stop-color:#2d8744"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="white" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Accent line -->
  <rect x="80" y="260" width="60" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Name -->
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="300" fill="white" letter-spacing="-1">Facundo</text>
  <text x="80" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="300" fill="#888" letter-spacing="-1">Zin</text>

  <!-- Title -->
  <text x="80" y="460" font-family="monospace" font-size="18" fill="#666" letter-spacing="2">SOFTWARE ENGINEER</text>

  <!-- Tech stack pills -->
  <g transform="translate(80, 490)">
    <rect x="0" y="0" width="60" height="28" rx="14" fill="none" stroke="#333" stroke-width="1"/>
    <text x="30" y="18" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">C#</text>

    <rect x="72" y="0" width="60" height="28" rx="14" fill="none" stroke="#333" stroke-width="1"/>
    <text x="102" y="18" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">.NET</text>

    <rect x="144" y="0" width="100" height="28" rx="14" fill="none" stroke="#333" stroke-width="1"/>
    <text x="194" y="18" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">TypeScript</text>

    <rect x="256" y="0" width="80" height="28" rx="14" fill="none" stroke="#333" stroke-width="1"/>
    <text x="296" y="18" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">NestJS</text>

    <rect x="348" y="0" width="72" height="28" rx="14" fill="none" stroke="#333" stroke-width="1"/>
    <text x="384" y="18" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">React</text>

    <rect x="432" y="0" width="76" height="28" rx="14" fill="none" stroke="#333" stroke-width="1"/>
    <text x="470" y="18" font-family="monospace" font-size="11" fill="#888" text-anchor="middle">Docker</text>
  </g>

  <!-- Decorative mascot hint (small thorny devil) -->
  <g transform="translate(1050, 480)" opacity="0.15">
    <rect x="6" y="10" width="9" height="6" rx="2" fill="#40c463"/>
    <rect x="13" y="8" width="6" height="6" rx="1.5" fill="#40c463"/>
    <circle cx="17" cy="10.5" r="0.8" fill="white"/>
    <path d="M 8 10 L 9 7 L 10 10" fill="#f59e0b"/>
    <path d="M 11 10 L 12 7 L 13 10" fill="#f59e0b"/>
    <path d="M 15 8 L 16 5 L 17 8" fill="#f59e0b"/>
  </g>

  <!-- URL -->
  <text x="1120" y="590" font-family="monospace" font-size="14" fill="#444" text-anchor="end">facundozin.vercel.app</text>
